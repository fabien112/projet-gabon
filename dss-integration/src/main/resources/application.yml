server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: dss-integration
  web:
    resources:
      # Frontend buildé (pack client) : dossier ./web à côté du JAR
      static-locations: classpath:/static/,file:${WEB_ROOT:./web}/
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/dss;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Africa/Libreville
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: ${H2_CONSOLE:true}
      path: /h2-console

# Profil postgres (SPRING_PROFILES_ACTIVE=postgres) : voir application-postgres.yml
# — Flyway activé, ddl-auto=validate, pas de console H2

dss:
  protocol: ${DSS_PROTOCOL:https}
  host: ${DSS_HOST:192.168.10.21}
  port: ${DSS_PORT:443}
  username: ${DSS_USERNAME:Fabien}
  password: ${DSS_PASSWORD:Libreville2026}
  verify-ssl: ${DSS_VERIFY_SSL:false}
  connect-timeout: ${DSS_CONNECT_TIMEOUT:10s}
  read-timeout: ${DSS_READ_TIMEOUT:15s}
  keep-alive-interval: ${DSS_KEEP_ALIVE_INTERVAL:25s}
  mq-enabled: ${DSS_MQ_ENABLED:true}
  login-type: ${DSS_LOGIN_TYPE:2}
  auto-login: ${DSS_AUTO_LOGIN:true}
  passenger-flow-poll-enabled: ${DSS_PASSENGER_FLOW_POLL_ENABLED:true}
  passenger-flow-poll-interval: ${DSS_PASSENGER_FLOW_POLL_INTERVAL:60s}
  # Startup full sync: enable a one-time historical import when DB is empty
  startup-full-sync-enabled: ${DSS_STARTUP_FULL_SYNC_ENABLED:false}
  startup-full-sync-days: ${DSS_STARTUP_FULL_SYNC_DAYS:30}

# Login unique partagé pour l'UI (tous les utilisateurs)
app:
  security:
    username: ${APP_LOGIN_USER:admin}
    password: ${APP_LOGIN_PASSWORD:PeopleCounting2026}
    superadmin-username: ${APP_SUPERADMIN_USER:superadmin}
    superadmin-password: ${APP_SUPERADMIN_PASSWORD:SuperAdmin2026}

logging:
  level:
    com.company.dss: ${DSS_LOG_LEVEL:INFO}
    org.springframework.web.reactive.function.client: ${DSS_HTTP_LOG_LEVEL:WARN}
