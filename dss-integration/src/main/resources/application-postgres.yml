# Profil production : PostgreSQL + Flyway (ddl-auto=validate)
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dss}
    username: ${DB_USER:dss_user}
    password: ${DB_PASSWORD:change_me}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Africa/Libreville
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
