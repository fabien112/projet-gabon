# Profil Docker : health probes + réglages conteneur
server:
  # Nginx (service web) termine le HTTP ; Spring doit voir le proto et l'hôte d'origine.
  forward-headers-strategy: framework

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
